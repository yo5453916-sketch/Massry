name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          set -e
          HTML=$(ls *.html | head -n1)
          mkdir -p android/app/src/main/java/com/youssef/iptv android/app/src/main/assets
          cp "$HTML" android/app/src/main/assets/index.html
          cd android
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'YoussefIPTV'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.youssef.iptv'
            compileSdk 34
            defaultConfig {
              applicationId 'com.youssef.iptv'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application
              android:label="Youssef IP TV"
              android:usesCleartextTraffic="true"
              android:hardwareAccelerated="true"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/youssef/iptv/MainActivity.java <<'EOF'
          package com.youssef.iptv;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          public class MainActivity extends Activity {
            WebView web; FrameLayout root; View custom; WebChromeClient.CustomViewCallback cb;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              root = new FrameLayout(this);
              web = new WebView(this);
              root.addView(web);
              setContentView(root);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient() {
                @Override public void onShowCustomView(View v, CustomViewCallback c) {
                  if (custom != null) { c.onCustomViewHidden(); return; }
                  custom = v; cb = c;
                  root.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  web.setVisibility(View.GONE);
                  getWindow().getDecorView().setSystemUiVisibility(5894);
                }
                @Override public void onHideCustomView() {
                  if (custom == null) return;
                  root.removeView(custom); custom = null;
                  web.setVisibility(View.VISIBLE);
                  getWindow().getDecorView().setSystemUiVisibility(0);
                  if (cb != null) cb.onCustomViewHidden();
                }
              });
              web.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() {
              if (custom != null) { web.getWebChromeClient().onHideCustomView(); }
              else if (web.canGoBack()) { web.goBack(); }
              else { super.onBackPressed(); }
            }
          }
          EOF
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YoussefIPTV-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
